<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12a89d" />
    <meta
      name="description"
      content="Fibispace is a creative agency for branding, social media marketing, ads production and market research. We make brands worth remembering."
    />

    <!-- Link previews (iMessage, WhatsApp, Facebook, LinkedIn, X). Crawlers
         don't run JS, so these must live in the static HTML. URLs must be
         absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fibispace" />
    <meta property="og:url" content="https://fibispace.com/" />
    <meta property="og:title" content="Fibispace — We Make Brands Worth Remembering" />
    <meta
      property="og:description"
      content="Branding, social media marketing, ads production and market research."
    />
    <meta property="og:image" content="https://fibispace.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fibispace — We Make Brands Worth Remembering" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fibispace — We Make Brands Worth Remembering" />
    <meta
      name="twitter:description"
      content="Branding, social media marketing, ads production and market research."
    />
    <meta name="twitter:image" content="https://fibispace.com/og-image.jpg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Manufacturing+Consent&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Fibispace</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
